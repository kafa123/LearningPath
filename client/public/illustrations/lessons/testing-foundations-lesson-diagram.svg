<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Tests are executable expectations</title>
<desc id="desc">A good test pins one expectation, exercises a boundary, and fails for a reason you can read.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#fb7185" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="2.8" opacity="1">TEST MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Tests are executable expectations</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <path d="M89.0 220 L111.0 176 L281.0 176 L303.0 220 Z" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-width="1.5"/><text x="196" y="206" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">E2E</text><text x="196" y="236" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">few</text><path d="M120.0 272 L142.0 228 L250.0 228 L272.0 272 Z" fill="#fb7185" fill-opacity="0.15000000000000002" stroke="#fb7185" stroke-width="1.5"/><text x="196" y="258" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">Integration</text><text x="196" y="288" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">some</text><path d="M151.0 324 L173.0 280 L219.0 280 L241.0 324 Z" fill="#fb7185" fill-opacity="0.2" stroke="#fb7185" stroke-width="1.5"/><text x="196" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">Unit</text><text x="196" y="340" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">many</text><rect x="408" y="138" width="504" height="116" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="426" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="1.6" opacity="1">ARRANGE → ACT → ASSERT</text><text x="426" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1.4" opacity="1">GIVEN</text><text x="426" y="216" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">state</text><text x="586" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1.4" opacity="1">WHEN</text><text x="586" y="216" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">action</text><text x="746" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1.4" opacity="1">THEN</text><text x="746" y="216" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">observable</text><rect x="408" y="274" width="504" height="96" rx="14" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="426" y="300" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="1.6" opacity="1">BOUNDARY TABLE</text><text x="426" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">4,999</text><path d="M500.0 320.0 l8.0 8.0 M508.0 320.0 l-8.0 8.0" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round"/><text x="520" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">reject</text><text x="586" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">5,000</text><path d="M664 324 l3.2 3.2 l7.2 -8.0" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">accept</text><text x="746" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">5,001</text><path d="M824 324 l3.2 3.2 l7.2 -8.0" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">accept</text><text x="408" y="398" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">one reason to fail → one clear signal</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">A good test pins one expectation, exercises a boundary, and fails for a reason you can read.</text>
</g>
</svg>
