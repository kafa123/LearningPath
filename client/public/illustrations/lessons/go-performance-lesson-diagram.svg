<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Allocations and container costs</title>
<desc id="desc">Performance work starts with a benchmark and ends with a smaller hot path, not with speculative micro-optimizations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#22d3ee" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2.8" opacity="1">COST MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Allocations and container costs</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <line x1="80" y1="130" x2="80" y2="330" stroke="#243449" stroke-width="1.5" opacity="1"/><line x1="80" y1="330" x2="500" y2="330" stroke="#243449" stroke-width="1.5" opacity="1"/><text x="92" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">allocations</text><text x="500" y="350" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="end" letter-spacing="0" opacity="1">input size</text><path d="M80 322 C 220 318, 380 270, 500 150" fill="none" stroke="#fb7185" stroke-width="2.4"/><path d="M80 322 L500 300" fill="none" stroke="#22d3ee" stroke-width="2.4"/><text x="330" y="182" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">append growth</text><text x="300" y="320" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#22d3ee" text-anchor="start" letter-spacing="0" opacity="1">make([]T, 0, n)</text><rect x="540" y="138" width="372" height="156" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="556" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">COST TABLE</text><text x="556" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">index by position</text><text x="896" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="end" letter-spacing="0" opacity="1">slice O(1)</text><text x="556" y="216" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">lookup by key</text><text x="896" y="216" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="end" letter-spacing="0" opacity="1">map avg O(1)</text><text x="556" y="240" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">recency + lookup</text><text x="896" y="240" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="end" letter-spacing="0" opacity="1">map + list O(1)</text><text x="556" y="264" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">ordered scan</text><text x="896" y="264" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="end" letter-spacing="0" opacity="1">sorted slice O(n)</text><rect x="540" y="314" width="372" height="60" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="556" y="338" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Benchmark → profile → change → re-run</text><text x="556" y="358" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">ns/op and allocs/op, not intuition</text><text x="80" y="376" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Preallocate when the size is known; measure before optimizing.</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Performance work starts with a benchmark and ends with a smaller hot path, not with speculative micro-optimizations.</text>
</g>
</svg>
