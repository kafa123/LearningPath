<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Growth, not stopwatch time</title>
<desc id="desc">Big-O describes an upper bound as the input grows; the machine and the constant factors are separate questions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#34d399" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="2.8" opacity="1">CONCEPT MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Growth, not stopwatch time</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <line x1="80" y1="120" x2="80" y2="382" stroke="#243449" stroke-width="1.5" opacity="1"/><line x1="80" y1="382" x2="492" y2="382" stroke="#243449" stroke-width="1.5" opacity="1"/><text x="90" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">time</text><text x="470" y="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="end" letter-spacing="0" opacity="1">input size</text><path d="M80 344 L492 344" fill="none" stroke="#34d399" stroke-width="2.4"/><text x="500" y="348" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="start" letter-spacing="0" opacity="1">O(1)</text><path d="M80 356 C 200 318, 340 292, 492 234" fill="none" stroke="#7dd3fc" stroke-width="2.4"/><text x="500" y="238" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#7dd3fc" text-anchor="start" letter-spacing="0" opacity="1">O(log n)</text><path d="M80 366 L492 196" fill="none" stroke="#a7f3d0" stroke-width="2.4"/><text x="500" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#a7f3d0" text-anchor="start" letter-spacing="0" opacity="1">O(n)</text><path d="M80 374 C 260 350, 400 268, 492 176" fill="none" stroke="#fcd34d" stroke-width="2.4"/><text x="500" y="180" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#fcd34d" text-anchor="start" letter-spacing="0" opacity="1">O(n log n)</text><path d="M80 378 C 330 368, 448 286, 492 130" fill="none" stroke="#fda4af" stroke-width="2.4"/><text x="500" y="134" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#fda4af" text-anchor="start" letter-spacing="0" opacity="1">O(n²)</text><rect x="560" y="138" width="352" height="236" rx="14" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="578" y="166" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="2" opacity="1">HOW TO READ IT</text><circle cx="590" cy="200" r="3" fill="#34d399" stroke="#34d399" stroke-width="1" opacity="1"/><text x="604" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Drop constants</text><text x="604" y="223" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">2n + 7  →  O(n)</text><circle cx="590" cy="256" r="3" fill="#34d399" stroke="#34d399" stroke-width="1" opacity="1"/><text x="604" y="260" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Keep the dominant term</text><text x="604" y="279" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">n² + n  →  O(n²)</text><circle cx="590" cy="312" r="3" fill="#34d399" stroke="#34d399" stroke-width="1" opacity="1"/><text x="604" y="316" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Compare growth</text><text x="604" y="335" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">n = 10⁶ changes the answer</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Big-O describes an upper bound as the input grows; the machine and the constant factors are separate questions.</text>
</g>
</svg>
