<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Copies, headers, and backing arrays</title>
<desc id="desc">Assignment copies the value. Slices and maps are small values that point at shared storage, so ownership must be explicit.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#22d3ee" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2.8" opacity="1">MEMORY MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Copies, headers, and backing arrays</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="138" width="264" height="214" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="66" y="166" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">VALUE</text><rect x="336" y="138" width="264" height="214" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="354" y="166" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">POINTER</text><rect x="624" y="138" width="264" height="214" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="642" y="166" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">SLICE / MAP</text><rect x="66" y="186" width="228" height="52" rx="9" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="80" y="208" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">account a</text><text x="80" y="226" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">id · balance</text><rect x="66" y="262" width="228" height="52" rx="9" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="80" y="284" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">account b</text><text x="80" y="302" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">same field values</text><line x1="180" y1="240" x2="180.0" y2="249.0" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="180.0,258.0 175.5,249.0 184.5,249.0" fill="#22d3ee"/><text x="190" y="254" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">copy</text><rect x="354" y="186" width="228" height="52" rx="9" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="368" y="208" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">&amp;account</text><text x="368" y="226" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">address value</text><circle cx="430" cy="282" r="30" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/><circle cx="430" cy="282" r="6" fill="#22d3ee" stroke="#22d3ee" stroke-width="1" opacity="1"/><line x1="480" y1="240" x2="466.6896473162245" y2="251.97931741539796" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="460.0,258.0 463.7,248.6 469.7,255.3" fill="#22d3ee"/><text x="354" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">*T dereferences</text><rect x="642" y="186" width="228" height="34" rx="8" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="656" y="208" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">ptr · len 2 · cap 4</text><rect x="642" y="230" width="228" height="34" rx="8" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="656" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">ptr · len 2 · cap 2</text><rect x="642" y="292" width="48" height="32" rx="7" fill="#22d3ee" stroke="#22d3ee" stroke-width="0" opacity="0.12"/><text x="666" y="313" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">1</text><rect x="698" y="292" width="48" height="32" rx="7" fill="#22d3ee" stroke="#22d3ee" stroke-width="0" opacity="0.12"/><text x="722" y="313" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">2</text><rect x="754" y="292" width="48" height="32" rx="7" fill="#22d3ee" stroke="#22d3ee" stroke-width="0" opacity="0.12"/><text x="778" y="313" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">3</text><rect x="810" y="292" width="48" height="32" rx="7" fill="#22d3ee" stroke="#22d3ee" stroke-width="0" opacity="0.12"/><text x="834" y="313" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">4</text><text x="642" y="342" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">same four cells</text><rect x="48" y="372" width="864" height="56" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="396" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="2" opacity="1">SHALLOW COPY</text><text x="64" y="416" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">copying a struct copies slice headers and map pointers; the elements stay shared</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Assignment copies the value. Slices and maps are small values that point at shared storage, so ownership must be explicit.</text>
</g>
</svg>
