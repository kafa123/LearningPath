<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">A query is a pipeline</title>
<desc id="desc">Write the query in SQL order; reason about it in logical order. Each stage narrows or reshapes the rows that reach the next one.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#38bdf8" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="2.8" opacity="1">EXECUTION MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">A query is a pipeline</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="146" width="128" height="54" rx="11" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="112.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4" opacity="1">FROM / JOIN</text><line x1="180" y1="173" x2="185.0" y2="173.0" stroke="#38bdf8" stroke-width="1.4" opacity="1"/><polygon points="194.0,173.0 185.0,177.5 185.0,168.5" fill="#38bdf8"/><rect x="190" y="146" width="104" height="54" rx="11" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="242.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4" opacity="1">WHERE</text><line x1="298" y1="173" x2="303.0" y2="173.0" stroke="#38bdf8" stroke-width="1.4" opacity="1"/><polygon points="312.0,173.0 303.0,177.5 303.0,168.5" fill="#38bdf8"/><rect x="308" y="146" width="132" height="54" rx="11" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="374.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4" opacity="1">GROUP BY</text><line x1="444" y1="173" x2="449.0" y2="173.0" stroke="#38bdf8" stroke-width="1.4" opacity="1"/><polygon points="458.0,173.0 449.0,177.5 449.0,168.5" fill="#38bdf8"/><rect x="454" y="146" width="104" height="54" rx="11" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="506.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4" opacity="1">HAVING</text><line x1="562" y1="173" x2="567.0" y2="173.0" stroke="#38bdf8" stroke-width="1.4" opacity="1"/><polygon points="576.0,173.0 567.0,177.5 567.0,168.5" fill="#38bdf8"/><rect x="572" y="146" width="104" height="54" rx="11" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="624.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4" opacity="1">SELECT</text><line x1="680" y1="173" x2="685.0" y2="173.0" stroke="#38bdf8" stroke-width="1.4" opacity="1"/><polygon points="694.0,173.0 685.0,177.5 685.0,168.5" fill="#38bdf8"/><rect x="690" y="146" width="132" height="54" rx="11" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="756.0" y="178" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4" opacity="1">ORDER / LIMIT</text><rect x="22.0" y="232" width="180" height="12" rx="6" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" opacity="0.22"/><text x="112.0" y="266" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">1,000 rows</text><rect x="172.0" y="232" width="140" height="12" rx="6" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" opacity="0.22"/><text x="242.0" y="266" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">400 rows</text><rect x="326.0" y="232" width="96" height="12" rx="6" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" opacity="0.22"/><text x="374.0" y="266" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">40 rows</text><rect x="476.0" y="232" width="60" height="12" rx="6" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" opacity="0.22"/><text x="506.0" y="266" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">12 rows</text><rect x="594.0" y="232" width="60" height="12" rx="6" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" opacity="0.22"/><text x="624.0" y="266" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">12 rows</text><rect x="741.0" y="232" width="30" height="12" rx="6" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" opacity="0.22"/><text x="756.0" y="266" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">5 rows</text><rect x="48" y="304" width="864" height="66" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fcd34d" text-anchor="start" letter-spacing="2" opacity="1">WRITTEN ORDER</text><text x="64" y="350" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">SELECT … FROM … WHERE … GROUP BY … ORDER BY</text><text x="520" y="328" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="2" opacity="1">LOGICAL ORDER</text><text x="520" y="350" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">FROM → WHERE → GROUP → HAVING → SELECT → ORDER</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Write the query in SQL order; reason about it in logical order. Each stage narrows or reshapes the rows that reach the next one.</text>
</g>
</svg>
