<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">One fact, one place</title>
<desc id="desc">A key identifies a row; a foreign key carries a relationship. Copying a fact into two tables creates two truths to maintain.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#38bdf8" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="2.8" opacity="1">MODEL MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">One fact, one place</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="138" width="252" height="196" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><rect x="48" y="138" width="252" height="36" rx="14" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><line x1="48" y1="174" x2="300" y2="174" stroke="#243449" stroke-width="1.5" opacity="1"/><text x="64" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="0" opacity="1">customers</text><text x="64" y="202" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">id</text><text x="284" y="202" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="end" letter-spacing="0" opacity="1">PK</text><text x="64" y="232" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">name</text><text x="64" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">email</text><rect x="412" y="168" width="252" height="196" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><rect x="412" y="168" width="252" height="36" rx="14" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><line x1="412" y1="204" x2="664" y2="204" stroke="#243449" stroke-width="1.5" opacity="1"/><text x="428" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="0" opacity="1">orders</text><text x="428" y="232" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">id</text><text x="648" y="232" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="end" letter-spacing="0" opacity="1">PK</text><text x="428" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">customer_id</text><text x="648" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="end" letter-spacing="0" opacity="1">FK</text><text x="428" y="292" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">total_cents</text><line x1="300" y1="232" x2="412" y2="250" stroke="#38bdf8" stroke-width="1.8" opacity="1"/><circle cx="410" cy="250" r="4" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" opacity="1"/><text x="330" y="278" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">1 → many</text><rect x="724" y="138" width="188" height="196" rx="14" fill="#0e1828" stroke="#7f1d1d" stroke-width="1.2" opacity="1"/><text x="740" y="166" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fecaca" text-anchor="start" letter-spacing="0" opacity="1">orders + address</text><line x1="740" y1="192" x2="896" y2="192" stroke="#3f2933" stroke-width="6" opacity="1"/><line x1="740" y1="218" x2="896" y2="218" stroke="#3f2933" stroke-width="6" opacity="1"/><line x1="740" y1="244" x2="896" y2="244" stroke="#3f2933" stroke-width="6" opacity="1"/><line x1="740" y1="270" x2="896" y2="270" stroke="#3f2933" stroke-width="6" opacity="1"/><path d="M814.0 300.0 l12.0 12.0 M826.0 300.0 l-12.0 12.0" stroke="#fb7185" stroke-width="2.4" stroke-linecap="round"/><text x="740" y="324" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">duplicate fact</text><text x="48" y="384" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="2" opacity="1">ONE FACT, ONE PLACE</text><text x="48" y="404" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">keys give identity · foreign keys give relationships · normalization removes repeated facts</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">A key identifies a row; a foreign key carries a relationship. Copying a fact into two tables creates two truths to maintain.</text>
</g>
</svg>
