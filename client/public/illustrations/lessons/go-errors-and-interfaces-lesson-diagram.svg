<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Error chains and interface contracts</title>
<desc id="desc">Wrap failures to add context without breaking errors.Is or errors.As, and keep interfaces small and close to the consumer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#22d3ee" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2.8" opacity="1">CONTRACT MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Error chains and interface contracts</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="138" width="184" height="78" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="62" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">sentinel</text><text x="62" y="186" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">errors.New</text><line x1="236" y1="176" x2="239.0" y2="176.0" stroke="#22d3ee" stroke-width="1.6" opacity="1"/><polygon points="248.0,176.0 239.0,180.5 239.0,171.5" fill="#22d3ee"/><rect x="252" y="138" width="184" height="78" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="266" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">wrap</text><text x="266" y="186" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">fmt.Errorf %w</text><line x1="440" y1="176" x2="443.0" y2="176.0" stroke="#22d3ee" stroke-width="1.6" opacity="1"/><polygon points="452.0,176.0 443.0,180.5 443.0,171.5" fill="#22d3ee"/><rect x="456" y="138" width="184" height="78" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="470" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">custom type</text><text x="470" y="186" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">Error + Unwrap</text><line x1="644" y1="176" x2="647.0" y2="176.0" stroke="#22d3ee" stroke-width="1.6" opacity="1"/><polygon points="656.0,176.0 647.0,180.5 647.0,171.5" fill="#22d3ee"/><rect x="660" y="138" width="184" height="78" rx="12" fill="#111c2e" stroke="#22d3ee" stroke-width="1" opacity="1"/><text x="674" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="0" opacity="1">inspect</text><text x="674" y="186" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">errors.Is / As</text><rect x="48" y="246" width="420" height="116" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="272" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">WRAP WITH CONTEXT</text><text x="64" y="298" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">fmt.Errorf(&quot;load order %s: %w&quot;, id, err)</text><text x="64" y="322" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">errors.Is finds the sentinel through the chain</text><text x="64" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">log once, at the boundary that decides</text><rect x="492" y="246" width="420" height="116" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="508" y="272" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">CONSUMER-OWNED INTERFACE</text><text x="508" y="298" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">type Notifier interface { Send(string) error }</text><text x="508" y="322" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">accept interfaces · return concrete types</text><text x="508" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">a typed nil inside an interface is not nil</text><text x="48" y="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Errors are values; interfaces are what a consumer needs, not what a producer offers.</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Wrap failures to add context without breaking errors.Is or errors.As, and keep interfaces small and close to the consumer.</text>
</g>
</svg>
