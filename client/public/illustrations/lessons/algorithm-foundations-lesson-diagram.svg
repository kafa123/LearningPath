<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">From problem to algorithm</title>
<desc id="desc">If you cannot state the steps and the boundary cases, you do not have an algorithm yet.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#34d399" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="2.8" opacity="1">CONCEPT MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">From problem to algorithm</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="142" width="190" height="118" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="0" opacity="1">1 · Understand</text><text x="64" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">inputs · outputs</text><text x="64" y="220" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">constraints</text><line x1="242" y1="201" x2="255.0" y2="201.0" stroke="#34d399" stroke-width="1.8" opacity="1"/><polygon points="264.0,201.0 255.0,205.5 255.0,196.5" fill="#34d399"/><rect x="270" y="142" width="190" height="118" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="286" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="0" opacity="1">2 · Decompose</text><text x="286" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">smaller steps</text><text x="286" y="220" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">clear contracts</text><line x1="464" y1="201" x2="477.0" y2="201.0" stroke="#34d399" stroke-width="1.8" opacity="1"/><polygon points="486.0,201.0 477.0,205.5 477.0,196.5" fill="#34d399"/><rect x="492" y="142" width="190" height="118" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="508" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="0" opacity="1">3 · Order</text><text x="508" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">finite sequence</text><text x="508" y="220" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">no hidden state</text><line x1="686" y1="201" x2="699.0" y2="201.0" stroke="#34d399" stroke-width="1.8" opacity="1"/><polygon points="708.0,201.0 699.0,205.5 699.0,196.5" fill="#34d399"/><rect x="714" y="142" width="190" height="118" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="730" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="0" opacity="1">4 · Verify</text><text x="730" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">examples</text><text x="730" y="220" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">edge cases</text><line x1="810" y1="268" x2="810" y2="306" stroke="#243449" stroke-width="1.4" stroke-dasharray="6 7" opacity="1"/><line x1="810" y1="306" x2="270" y2="306" stroke="#243449" stroke-width="1.4" stroke-dasharray="6 7" opacity="1"/><line x1="270" y1="306" x2="270.0" y2="275.0" stroke="#34d399" stroke-width="1.8" stroke-dasharray="6 7" opacity="1"/><polygon points="270.0,266.0 274.5,275.0 265.5,275.0" fill="#34d399"/><text x="540" y="300" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="0" opacity="1">a failing example sends you back</text><rect x="48" y="334" width="864" height="56" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="358" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="2" opacity="1">ALGORITHM</text><text x="64" y="378" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">finite · ordered · unambiguous · effective</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">If you cannot state the steps and the boundary cases, you do not have an algorithm yet.</text>
</g>
</svg>
