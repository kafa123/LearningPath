<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Bounded fan-out with cancellation</title>
<desc id="desc">A worker pool bounds concurrency; a context bounds lifetime. Both are required for predictable load and clean shutdown.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#22d3ee" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2.8" opacity="1">EXECUTION MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Bounded fan-out with cancellation</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="196" width="120" height="76" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="108" y="226" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">jobs</text><text x="108" y="248" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">queue</text><rect x="268" y="130" width="150" height="56" rx="10" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="282" y="153" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">worker 1</text><text x="282" y="172" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">select on ctx</text><line x1="170" y1="232" x2="256.92835909518584" y2="163.56703645698136" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="264.0,158.0 259.7,167.1 254.1,160.0" fill="#22d3ee"/><rect x="268" y="200" width="150" height="56" rx="10" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="282" y="223" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">worker 2</text><text x="282" y="242" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">select on ctx</text><line x1="170" y1="232" x2="255.0081374338519" y2="228.38263244962332" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="264.0,228.0 255.2,232.9 254.8,223.9" fill="#22d3ee"/><rect x="268" y="270" width="150" height="56" rx="10" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="282" y="293" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">worker 3</text><text x="282" y="312" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">select on ctx</text><line x1="170" y1="232" x2="256.63428277926283" y2="292.82832620671644" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="264.0,298.0 254.0,296.5 259.2,289.1" fill="#22d3ee"/><rect x="510" y="196" width="150" height="76" rx="12" fill="#111c2e" stroke="#22d3ee" stroke-width="1" opacity="1"/><text x="585" y="224" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="0" opacity="1">results</text><text x="585" y="244" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">input order</text><line x1="422" y1="158" x2="499.2467690464843" y2="226.05072511237904" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="506.0,232.0 496.3,229.4 502.2,222.7" fill="#22d3ee"/><line x1="422" y1="228" x2="497.01018676048005" y2="231.57191365526094" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="506.0,232.0 496.8,236.1 497.2,227.1" fill="#22d3ee"/><line x1="422" y1="298" x2="498.9231349505982" y2="237.56039396738714" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="506.0,232.0 501.7,241.1 496.1,234.0" fill="#22d3ee"/><rect x="716" y="130" width="196" height="30" rx="15.0" fill="#fb7185" stroke="#fb7185" stroke-width="1" opacity="0.14"/><text x="814.0" y="148.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#fb7185" text-anchor="middle" letter-spacing="0" opacity="1">ctx.Done()</text><line x1="814" y1="164" x2="814.0" y2="191.0" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="6 7" opacity="1"/><polygon points="814.0,200.0 809.5,191.0 818.5,191.0" fill="#fb7185"/><rect x="716" y="204" width="196" height="72" rx="10" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="730" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">cancel outstanding</text><text x="730" y="250" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">wait for every worker</text><text x="730" y="268" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">close only from the sender</text><rect x="48" y="320" width="864" height="74" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">OWNERSHIP RULES</text><text x="64" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">concurrency ≤ workers · no goroutine outlives its request · first error stops the fan-out</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">A worker pool bounds concurrency; a context bounds lifetime. Both are required for predictable load and clean shutdown.</text>
</g>
</svg>
