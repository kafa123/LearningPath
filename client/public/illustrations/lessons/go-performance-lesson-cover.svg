  <text x="52" y="322" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="172" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="0" opacity="1">19</text>
</g>
<g>
  <rect x="72" y="64" width="8" height="8" rx="2" fill="#22d3ee"/>
