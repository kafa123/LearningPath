  <text x="72" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start" letter-spacing="3.2" opacity="1">LESSON 19</text>
</g>
<g><line x1="590" y1="110" x2="590" y2="300" stroke="#243449" stroke-width="1.5" opacity="1"/><line x1="590" y1="300" x2="1086" y2="300" stroke="#243449" stroke-width="1.5" opacity="1"/><text x="600" y="126" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">allocations</text><text x="1086" y="320" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="end" letter-spacing="0" opacity="1">input size</text><path d="M590 292 C 760 288, 920 230, 1086 122" fill="none" stroke="#fb7185" stroke-width="2.4"/><path d="M590 292 L1086 264" fill="none" stroke="#22d3ee" stroke-width="2.4"/><text x="900" y="150" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">append growth</text><text x="862" y="282" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#22d3ee" text-anchor="start" letter-spacing="0" opacity="1">preallocated</text><text x="560" y="342" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">make([]T, 0, n)</text><text x="560" y="364" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">append only when capacity is unknown</text><text x="560" y="386" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">map + list = O(1) LRU recency</text></g>
