<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
<title id="title">Go Engineering lesson cover</title>
<desc id="desc">Abstract illustration for lesson 19 in Go Engineering.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="0.55" stop-color="#0d1728"/>
    <stop offset="1" stop-color="#111d31"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
