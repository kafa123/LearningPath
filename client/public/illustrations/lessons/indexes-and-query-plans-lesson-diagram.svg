" stroke-dasharray="6 7" opacity="1"/><rect x="764" y="306" width="40" height="26" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><line x1="560" y1="272" x2="858" y2="306" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 7" opacity="1"/><rect x="838" y="306" width="40" height="26" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="454" y="360" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">SEARCH  ·  follows only the matching branch</text><rect x="48" y="398" width="470" height="34" rx="17.0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" opacity="0.14"/><text x="283.0" y="418.675" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="0" opacity="1">EXPLAIN QUERY PLAN  →  USING INDEX</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">A composite index is ordered like a phone book: equality columns first, then the range and sort columns.</text>
</g>
