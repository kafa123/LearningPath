<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Reproduce, isolate, falsify</title>
<desc id="desc">A fix without a regression test is a guess that happens to pass today.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#fb7185" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="2.8" opacity="1">DEBUG LOOP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Reproduce, isolate, falsify</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="140" width="190" height="112" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">1 · Reproduce</text><text x="64" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">smallest failing input</text><line x1="242" y1="196" x2="255.0" y2="196.0" stroke="#fb7185" stroke-width="1.7" opacity="1"/><polygon points="264.0,196.0 255.0,200.5 255.0,191.5" fill="#fb7185"/><rect x="270" y="140" width="190" height="112" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="286" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">2 · Isolate</text><text x="286" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">narrow the surface</text><line x1="464" y1="196" x2="477.0" y2="196.0" stroke="#fb7185" stroke-width="1.7" opacity="1"/><polygon points="486.0,196.0 477.0,200.5 477.0,191.5" fill="#fb7185"/><rect x="492" y="140" width="190" height="112" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="508" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">3 · Falsify</text><text x="508" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">test the hypothesis</text><line x1="686" y1="196" x2="699.0" y2="196.0" stroke="#fb7185" stroke-width="1.7" opacity="1"/><polygon points="708.0,196.0 699.0,200.5 699.0,191.5" fill="#fb7185"/><rect x="714" y="140" width="190" height="112" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="730" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">4 · Fix</text><text x="730" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">cause, not symptom</text><line x1="810" y1="256" x2="810" y2="292" stroke="#243449" stroke-width="1.4" stroke-dasharray="6 7" opacity="1"/><line x1="810" y1="292" x2="270" y2="292" stroke="#243449" stroke-width="1.4" stroke-dasharray="6 7" opacity="1"/><line x1="270" y1="292" x2="270.0" y2="263.0" stroke="#fb7185" stroke-width="1.7" stroke-dasharray="6 7" opacity="1"/><polygon points="270.0,254.0 274.5,263.0 265.5,263.0" fill="#fb7185"/><text x="540" y="286" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="0" opacity="1">keep the regression test</text><rect x="48" y="318" width="420" height="92" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="1.6" opacity="1">MINIMAL FAILING CASE</text><text x="64" y="370" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">start=1 · end=3</text><text x="64" y="392" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">expected 9 · actual 5</text><circle cx="560" cy="360" r="44" fill="none" stroke="#f8fafc" stroke-width="2" opacity="1"/><line x1="590" y1="390" x2="620" y2="420" stroke="#f8fafc" stroke-width="2" opacity="1"/><text x="500" y="350" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">i &lt; end</text><text x="500" y="372" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#34d399" text-anchor="start" letter-spacing="0" opacity="1">i &lt;= end</text><text x="700" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#fb7185" text-anchor="start" letter-spacing="0" opacity="1">fix the cause</text><text x="700" y="366" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">keep the test</text><text x="700" y="388" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">watch the next edge</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">A fix without a regression test is a guess that happens to pass today.</text>
</g>
</svg>
