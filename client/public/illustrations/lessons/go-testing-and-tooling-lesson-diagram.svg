<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Testable seams, deterministic runs</title>
<desc id="desc">Inject time and I/O, keep logic deterministic, and let the Go toolchain repeat the same result on every machine.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#22d3ee" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2.8" opacity="1">TEST MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Testable seams, deterministic runs</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="340" y="134" width="278" height="132" rx="12" fill="#111c2e" stroke="#22d3ee" stroke-width="1" opacity="1"/><text x="356" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">LOGIC</text><text x="356" y="188" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">pure decisions</text><text x="356" y="210" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">no wall clock</text><text x="356" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">no random source</text><text x="356" y="250" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">no hidden globals</text><rect x="48" y="134" width="244" height="66" rx="10" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="62" y="158" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Clock</text><text x="62" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">fixed timestamps</text><line x1="294" y1="167" x2="327.0" y2="167.0" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="336.0,167.0 327.0,171.5 327.0,162.5" fill="#22d3ee"/><rect x="48" y="212" width="244" height="66" rx="10" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="62" y="236" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Sleeper</text><text x="62" y="257" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">recorded delays</text><line x1="294" y1="245" x2="329.8591357467599" y2="206.57949741418582" stroke="#22d3ee" stroke-width="1.4" opacity="1"/><polygon points="336.0,200.0 333.1,209.6 326.6,203.5" fill="#22d3ee"/><rect x="664" y="134" width="248" height="144" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="680" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">ONE LOOP</text><path d="M682 182 l3.0 3.0 l6.75 -7.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="188" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">go test ./...</text><path d="M682 206 l3.0 3.0 l6.75 -7.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">go test -race ./...</text><path d="M682 230 l3.0 3.0 l6.75 -7.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="236" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">go vet ./...</text><path d="M682 254 l3.0 3.0 l6.75 -7.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="260" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">gofmt -l .</text><rect x="48" y="292" width="864" height="92" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="318" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">DETERMINISM</text><text x="64" y="342" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">table cases name one reason to fail · subtests share no mutable state</text><text x="64" y="364" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">a timeout is a safety net, not an assertion; assert state, not elapsed time</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Inject time and I/O, keep logic deterministic, and let the Go toolchain repeat the same result on every machine.</text>
</g>
</svg>
