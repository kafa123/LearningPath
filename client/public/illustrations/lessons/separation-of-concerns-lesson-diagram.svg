<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Dependencies point inward</title>
<desc id="desc">Separation of concerns is fewer hidden coupling points, not more folders.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#fbbf24" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="2.8" opacity="1">LAYER MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Dependencies point inward</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <circle cx="270" cy="258" r="128" fill="none" stroke="#fcd34d" stroke-width="1.8" opacity="0.8"/><circle cx="270" cy="258" r="92" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.8"/><circle cx="270" cy="258" r="56" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.8"/><text x="270" y="263" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0" opacity="1">domain</text><text x="270" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#fde68a" text-anchor="middle" letter-spacing="0" opacity="1">application</text><text x="270" y="148" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#fef3c7" text-anchor="middle" letter-spacing="0" opacity="1">delivery</text><line x1="96" y1="214" x2="129.0" y2="214.0" stroke="#fbbf24" stroke-width="1.8" opacity="1"/><polygon points="138.0,214.0 129.0,218.5 129.0,209.5" fill="#fbbf24"/><line x1="96" y1="258" x2="129.0" y2="258.0" stroke="#fbbf24" stroke-width="1.8" opacity="1"/><polygon points="138.0,258.0 129.0,262.5 129.0,253.5" fill="#fbbf24"/><line x1="96" y1="302" x2="129.0" y2="302.0" stroke="#fbbf24" stroke-width="1.8" opacity="1"/><polygon points="138.0,302.0 129.0,306.5 129.0,297.5" fill="#fbbf24"/><text x="96" y="420" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">dependencies point inward</text><rect x="472" y="140" width="440" height="224" rx="14" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="490" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="2" opacity="1">ONE REASON TO CHANGE</text><text x="490" y="202" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">HTTP layer</text><text x="490" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">routing · status · payload shape</text><circle cx="884" cy="198" r="3" fill="#fbbf24" stroke="#fbbf24" stroke-width="1" opacity="1"/><text x="490" y="254" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Application layer</text><text x="490" y="274" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">use-case orchestration · transactions</text><circle cx="884" cy="250" r="3" fill="#fbbf24" stroke="#fbbf24" stroke-width="1" opacity="1"/><text x="490" y="306" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Domain layer</text><text x="490" y="326" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">rules that outlive the framework</text><circle cx="884" cy="302" r="3" fill="#fbbf24" stroke="#fbbf24" stroke-width="1" opacity="1"/>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Separation of concerns is fewer hidden coupling points, not more folders.</text>
