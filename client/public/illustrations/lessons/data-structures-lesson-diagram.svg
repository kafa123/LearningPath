="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">index O(1)</text><text x="66" y="308" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">search O(n)</text><text x="66" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">order preserved</text><rect x="336" y="140" width="264" height="224" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="354" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="1.8" opacity="1">HASH MAP</text><rect x="354" y="188" width="104" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><line x1="464" y1="197" x2="493.0" y2="197.0" stroke="#34d399" stroke-width="1.2" opacity="1"/><polygon points="502.0,197.0 493.0,201.5 493.0,192.5" fill="#34d399"/><rect x="508" y="188" width="74" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><rect x="354" y="212" width="104" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><line x1="464" y1="221" x2="493.0" y2="221.0" stroke="#34d399" stroke-width="1.2" opacity="1"/><polygon points="502.0,221.0 493.0,225.5 493.0,216.5" fill="#34d399"/><rect x="508" y="212" width="74" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><rect x="354" y="236" width="104" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><line x1="464" y1="245" x2="493.0" y2="245.0" stroke="#34d399" stroke-width="1.2" opacity="1"/><polygon points="502.0,245.0 493.0,249.5 493.0,240.5" fill="#34d399"/><rect x="508" y="236" width="74" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="354" y="286" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">lookup ~O(1)</text><text x="354" y="308" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">no inherent order</text><text x="354" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">key → value</text><rect x="624" y="140" width="264" height="224" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="642" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="1.8" opacity="1">STACK · QUEUE</text><rect x="642" y="250" width="104" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><rect x="642" y="228" width="104" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><rect x="642" y="206" width="104" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><rect x="642" y="184" width="104" height="18" rx="5" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><line x1="760" y1="236" x2="760.0" y2="179.0" stroke="#34d399" stroke-width="1.4" opacity="1"/><polygon points="760.0,170.0 764.5,179.0 755.5,179.0" fill="#34d399"/><text x="642" y="286" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">ends O(1)</text><text x="642" y="308" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">no random access</text><text x="642" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">LIFO · FIFO</text><text x="48" y="398" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Ask which operation dominates before choosing a container.</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">A structure is a cost profile, not a personality: index, search, order, and ends each trade off differently.</text>
</g>
