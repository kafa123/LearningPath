m, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">r.Context()</text><line x1="550" y1="186" x2="555.0" y2="186.0" stroke="#22d3ee" stroke-width="1.5" opacity="1"/><polygon points="564.0,186.0 555.0,190.5 555.0,181.5" fill="#22d3ee"/><rect x="570" y="142" width="150" height="88" rx="12" fill="#111c2e" stroke="#22d3ee" stroke-width="1" opacity="1"/><text x="584" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="0.8" opacity="1">store</text><text x="584" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">ctx-aware</text><text x="584" y="214" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">r.Context()</text><line x1="724" y1="186" x2="729.0" y2="186.0" stroke="#22d3ee" stroke-width="1.5" opacity="1"/><polygon points="738.0,186.0 729.0,190.5 729.0,181.5" fill="#22d3ee"/><rect x="744" y="142" width="150" height="88" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="758" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1" text-anchor="start" letter-spacing="0.8" opacity="1">response</text><text x="758" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">status + JSON</text><rect x="48" y="274" width="194" height="32" rx="16.0" fill="#34d399" stroke="#34d399" stroke-width="1" opacity="0.14"/><text x="145.0" y="293.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="0" opacity="1">201 created</text><rect x="264" y="274" width="194" height="32" rx="16.0" fill="#fbbf24" stroke="#fbbf24" stroke-width="1" opacity="0.14"/><text x="361.0" y="293.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="0" opacity="1">400 invalid</text><rect x="480" y="274" width="194" height="32" rx="16.0" fill="#fb7185" stroke="#fb7185" stroke-width="1" opacity="0.14"/><text x="577.0" y="293.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#fb7185" text-anchor="middle" letter-spacing="0" opacity="1">404 missing</text><rect x="696" y="274" width="194" height="32" rx="16.0" fill="#fb7185" stroke="#fb7185" stroke-width="1" opacity="0.14"/><text x="793.0" y="293.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#fb7185" text-anchor="middle" letter-spacing="0" opacity="1">500 opaque</text><rect x="48" y="330" width="864" height="62" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="354" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">BOUNDARY CONTRACT</text><text x="64" y="378" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">one JSON error shape · request context in every call · no internal detail in the body</text>
