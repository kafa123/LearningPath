<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Request flow through a handler</title>
<desc id="desc">A handler decodes, validates, calls the domain with the request context, and writes one stable response shape.</desc>
