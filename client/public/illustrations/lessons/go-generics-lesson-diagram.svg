<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Type parameters and constraints</title>
<desc id="desc">Generics fit identical algorithms over different element types; they stop fitting when the constraint has to describe behavior.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#22d3ee" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2.8" opacity="1">ABSTRACTION MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Type parameters and constraints</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="138" width="400" height="156" rx="12" fill="#111c2e" stroke="#22d3ee" stroke-width="1" opacity="1"/><text x="64" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">TYPE PARAMETERS</text><text x="64" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">func Batch[T any](items []T, size int)</text><text x="64" y="214" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">    ([][]T, error)</text><text x="64" y="242" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">T any  →  store and move</text><text x="64" y="264" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">T comparable  →  map key / ==</text><text x="64" y="286" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">instantiation stays inferred</text><rect x="476" y="138" width="436" height="156" rx="12" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="492" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.8" opacity="1">CONSTRAINT</text><text x="492" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">type Number interface {</text><text x="492" y="214" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="start" letter-spacing="0" opacity="1">    ~int | ~int64 | ~float64</text><text x="492" y="236" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">}</text><text x="492" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">~ admits defined types such as Cents</text><text x="492" y="284" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">list only the operations the body uses</text><rect x="48" y="318" width="864" height="80" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="1.8" opacity="1">STOP WHEN</text><text x="64" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">behavior differs by type · one instantiation · the constraint becomes a protocol · reflection is already needed</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Generics fit identical algorithms over different element types; they stop fitting when the constraint has to describe behavior.</text>
</g>
</svg>
