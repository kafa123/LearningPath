<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Resources, methods, status</title>
<desc id="desc">Name resources with nouns, choose the method by the intent, and let the status tell the caller what happened.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a101c"/>
    <stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="478" rx="20"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="478" rx="20" fill="url(#bg)" stroke="#243449"/>
<g clip-path="url(#frame)">
  <rect width="960" height="480" fill="url(#grid)"/>
  <ellipse cx="840" cy="60" rx="240" ry="150" fill="#a78bfa" opacity="0.05"/>
  <text x="48" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="2.8" opacity="1">CONTRACT MAP</text>
  <text x="48" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" fill="#f1f5f9" text-anchor="start" letter-spacing="0" opacity="1">Resources, methods, status</text>
  <line x1="48" y1="102" x2="912" y2="102" stroke="#243449" stroke-width="1" opacity="1"/>
  <rect x="48" y="152" width="232" height="160" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="64" y="180" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="2" opacity="1">CLIENT</text><text x="64" y="210" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">GET /orders/42</text><text x="64" y="234" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">Accept: application/json</text><text x="64" y="260" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">Authorization: …</text><rect x="680" y="152" width="232" height="160" rx="14" fill="#111c2e" stroke="#243449" stroke-width="1" opacity="1"/><text x="696" y="180" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="2" opacity="1">SERVER</text><text x="696" y="210" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">resource: order 42</text><text x="696" y="234" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">method: read</text><text x="696" y="260" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">representation: JSON</text><line x1="284" y1="190" x2="667.0" y2="190.0" stroke="#a78bfa" stroke-width="2" opacity="1"/><polygon points="676.0,190.0 667.0,194.5 667.0,185.5" fill="#a78bfa"/><line x1="676" y1="274" x2="293.0" y2="274.0" stroke="#a78bfa" stroke-width="2" opacity="1"/><polygon points="284.0,274.0 293.0,269.5 293.0,278.5" fill="#a78bfa"/><rect x="338" y="172" width="284" height="36" rx="18.0" fill="#a78bfa" stroke="#a78bfa" stroke-width="1" opacity="0.14"/><text x="480.0" y="193.675" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#a78bfa" text-anchor="middle" letter-spacing="0" opacity="1">request  ·  safe / idempotent</text><rect x="338" y="258" width="284" height="36" rx="18.0" fill="#34d399" stroke="#34d399" stroke-width="1" opacity="0.14"/><text x="480.0" y="279.675" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="0" opacity="1">response  ·  200 OK + body</text><rect x="48" y="336" width="56" height="26" rx="13" fill="#34d399" stroke="#34d399" stroke-width="0" opacity="0.13"/><text x="76" y="354" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0" opacity="1">2xx</text><text x="120" y="354" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">success</text><rect x="48" y="370" width="56" height="26" rx="13" fill="#fbbf24" stroke="#fbbf24" stroke-width="0" opacity="0.13"/><text x="76" y="388" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0" opacity="1">4xx</text><text x="120" y="388" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">caller must change</text><rect x="48" y="404" width="56" height="26" rx="13" fill="#fb7185" stroke="#fb7185" stroke-width="0" opacity="0.13"/><text x="76" y="422" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="0" opacity="1">5xx</text><text x="120" y="422" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">server failed</text><text x="680" y="360" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">A resource is a noun.</text><text x="680" y="382" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">The method is the verb.</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">Name resources with nouns, choose the method by the intent, and let the status tell the caller what happened.</text>
</g>
</svg>
