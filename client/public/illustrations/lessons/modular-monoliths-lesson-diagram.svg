hor="middle" letter-spacing="0" opacity="1">port</text><line x1="244" y1="258" x2="356" y2="258" stroke="#243449" stroke-width="4" opacity="1"/><line x1="244" y1="276" x2="356" y2="276" stroke="#243449" stroke-width="4" opacity="1"/><line x1="244" y1="294" x2="356" y2="294" stroke="#243449" stroke-width="4" opacity="1"/><line x1="378" y1="230" x2="383.0" y2="230.0" stroke="#fbbf24" stroke-width="1.6" opacity="1"/><polygon points="392.0,230.0 383.0,234.5 383.0,225.5" fill="#fbbf24"/><rect x="394" y="184" width="146" height="154" rx="12" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="408" y="208" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">Billing</text><rect x="408" y="220" width="58" height="20" rx="10" fill="#fbbf24" stroke="#fbbf24" stroke-width="0" opacity="0.15"/><text x="437" y="234" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0" opacity="1">port</text><line x1="408" y1="258" x2="520" y2="258" stroke="#243449" stroke-width="4" opacity="1"/><line x1="408" y1="276" x2="520" y2="276" stroke="#243449" stroke-width="4" opacity="1"/><line x1="408" y1="294" x2="520" y2="294" stroke="#243449" stroke-width="4" opacity="1"/><text x="66" y="354" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">modules call contracts, not internals</text><rect x="600" y="136" width="312" height="234" rx="14" fill="#0e1828" stroke="#243449" stroke-width="1" opacity="1"/><text x="618" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="2" opacity="1">WHY ONE DEPLOYABLE</text><path d="M628 198 l3.6 3.6 l8.1 -9.0" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="203" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">in-process call</text><path d="M624.0 234.0 l8.0 8.0 M632.0 234.0 l-8.0 8.0" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="243" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">network hop</text><path d="M628 278 l3.6 3.6 l8.1 -9.0" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="283" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#cbd5e1" text-anchor="start" letter-spacing="0" opacity="1">one transaction</text><path d="M624.0 314.0 l8.0 8.0 M632.0 314.0 l-8.0 8.0" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="323" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">independent deploy</text>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">A modular monolith keeps the deployment simple while making module contracts explicit enough to change safely.</text>
</g>
